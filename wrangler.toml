name = "evid-wall"
main = "src/worker.js"
compatibility_date = "2026-08-21"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "evid-wall-db"
database_id = "f02efe89-d71c-44f5-88dc-4e9d0865f078"

[[r2_buckets]]
binding = "FILES"
bucket_name = "evid-wall-files"

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "3194091371"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "3194091372"

  [ratelimits.simple]
  limit = 6
  period = 60

[vars]
MAX_FILE_BYTES = "20971520"
MAX_FILES_PER_ENTRY = "4"
MAX_DAILY_SUBMISSIONS = "5"
MAX_DAILY_BYTES = "52428800"
FILE_RETENTION_DAYS = "30"
