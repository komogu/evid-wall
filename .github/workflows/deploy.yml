name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global wrangler@4.125.0
      - run: |
          mkdir -p public/assets
          cp index.html discussion.html public/
          cp -r assets/. public/assets/
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_CONFIG: ${{ secrets.DEPLOY_CONFIG }}
        run: |
          printf '%s' "$DEPLOY_CONFIG" > "$RUNNER_TEMP/deploy.toml"
          wrangler deploy --config "$RUNNER_TEMP/deploy.toml"
